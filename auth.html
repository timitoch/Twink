<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-color-scheme="pure-black">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - WordLab</title>
    <link rel="stylesheet" href="style-base.css">
    <link rel="stylesheet" href="style-auth.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card-wrapper {
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.4s ease-out;
        }

        .hidden {
            display: none !important;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>

<body>

    <div class="auth-card-wrapper">
        <!-- Login Screen -->
        <div id="login-screen" class="glass-card">
            <div class="app-logo">
                <h1>Вход</h1>
                <span>Личный словарь</span>
            </div>
            <form id="login-form" class="auth-container">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" required placeholder="Email" class="glass-input">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <div style="position: relative;">
                        <input type="password" id="login-password" required placeholder="Пароль" class="glass-input">
                        <button type="button" class="btn-icon password-toggle"
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-closed hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="status-message" id="login-error"></div>
                <button type="submit" class="btn-primary">Войти</button>
            </form>
            <div class="auth-switch">Нет аккаунта? <a href="#" id="to-register">Регистрация</a></div>
        </div>

        <!-- Register Screen -->
        <div id="register-screen" class="glass-card hidden">
            <div class="app-logo">
                <h1>Регистрация</h1>
                <span>Создание профиля</span>
            </div>
            <form id="register-form" class="auth-container">
                <div class="form-group">
                    <label>Никнейм</label>
                    <input type="text" id="reg-nickname" required placeholder="Никнейм" class="glass-input">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" required placeholder="Email" class="glass-input">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <div style="position: relative;">
                        <input type="password" id="reg-password" required placeholder="Пароль" class="glass-input">
                        <button type="button" class="btn-icon password-toggle"
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-closed hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Подтверждение</label>
                    <div style="position: relative;">
                        <input type="password" id="reg-password-confirm" required placeholder="Повторите пароль"
                            class="glass-input">
                        <button type="button" class="btn-icon password-toggle"
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);">
                            <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-closed hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                                </path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="status-message" id="reg-error"></div>
                <button type="submit" class="btn-primary">Создать аккаунт</button>
            </form>
            <div class="auth-switch">Уже есть аккаунт? <a href="#" id="to-login">Войти</a></div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>

</html>
